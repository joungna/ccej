<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>경실련 보도자료 지식맵 | CCEJ Press Knowledge Map</title>
<meta name="description" content="경실련(ccej.or.kr) 공개 보도자료 405건을 인터랙티브 지식맵으로 탐색하는 비공식 아카이브">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- D3.js -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<link rel="stylesheet" href="./assets/style.css?v=2">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

<div id="app" class="flex flex-col overflow-hidden">

  <!-- ============ Header ============ -->
  <header class="flex-shrink-0 border-b border-gray-200 bg-white/90 backdrop-blur z-30">
    <div class="flex items-center gap-3 px-4 py-3">
      <button id="mobile-filter-toggle" class="md:hidden p-2 rounded-lg hover:bg-gray-100" aria-label="필터 열기">
        <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-gray-900 text-white flex items-center justify-center font-bold text-sm">시</div>
        <div class="hidden sm:block leading-tight">
          <div class="font-bold text-sm">경실련 보도자료 지식맵</div>
          <div class="text-[11px] text-gray-400">CCEJ Press Knowledge Map</div>
        </div>
      </div>

      <div class="flex-1 relative max-w-xl mx-auto">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="search-input" type="text" placeholder="제목·본문·태그·작성자·카테고리 검색"
          class="w-full pl-9 pr-3 py-2 rounded-full border border-gray-300 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400">
      </div>

      <button id="mobile-list-toggle" class="p-2 rounded-lg hover:bg-gray-100" aria-label="리스트 보기">
        <i data-lucide="list" class="w-5 h-5"></i>
      </button>
      <span id="result-count" class="hidden md:inline text-xs text-gray-500 whitespace-nowrap"></span>
    </div>

    <!-- Month chip navigation -->
    <div id="month-chips" class="no-scrollbar flex items-center gap-2 px-4 pb-3 overflow-x-auto"></div>
  </header>

  <!-- ============ Body: sidebar + map + detail ============ -->
  <div class="relative flex-1 min-h-0 flex">

    <!-- Backdrop for mobile overlays -->
    <div id="overlay-backdrop" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden"></div>

    <!-- ===== Filter panel ===== -->
    <aside id="filter-panel"
      class="slide-panel fixed md:static inset-x-0 bottom-0 md:inset-auto z-40 w-full md:w-72 h-[85vh] md:h-auto
             bg-white border-t md:border-t-0 md:border-r border-gray-200 rounded-t-2xl md:rounded-none
             translate-y-full md:translate-y-0 flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 shrink-0">
        <div class="font-semibold text-sm flex items-center gap-1.5"><i data-lucide="filter" class="w-4 h-4"></i> 필터</div>
        <div class="flex items-center gap-2">
          <button id="reset-filters" class="text-xs text-gray-500 hover:text-gray-900 underline">초기화</button>
          <button id="close-filter" class="md:hidden p-1 rounded hover:bg-gray-100"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto thin-scroll px-4 py-4 space-y-5">
        <!-- Year -->
        <div>
          <label class="text-xs font-semibold text-gray-500 mb-1.5 block">연도</label>
          <select id="filter-year" class="w-full text-sm border border-gray-300 rounded-lg px-2.5 py-2 bg-white"></select>
        </div>

        <!-- Type -->
        <div>
          <label class="text-xs font-semibold text-gray-500 mb-1.5 block">유형</label>
          <div class="flex flex-wrap gap-2">
            <label class="flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 rounded-full px-2.5 py-1.5 cursor-pointer">
              <input type="checkbox" class="type-check" value="첨부파일"> 📎 첨부파일
            </label>
            <label class="flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 rounded-full px-2.5 py-1.5 cursor-pointer">
              <input type="checkbox" class="type-check" value="이미지"> 🖼 이미지
            </label>
            <label class="flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 rounded-full px-2.5 py-1.5 cursor-pointer">
              <input type="checkbox" class="type-check" value="동영상"> 🎬 동영상
            </label>
            <label class="flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 rounded-full px-2.5 py-1.5 cursor-pointer">
              <input type="checkbox" class="type-check" value="행사"> 📅 행사
            </label>
            <label class="flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 rounded-full px-2.5 py-1.5 cursor-pointer">
              <input type="checkbox" class="type-check" value="공지"> 📢 공지
            </label>
            <label class="flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 rounded-full px-2.5 py-1.5 cursor-pointer">
              <input type="checkbox" class="type-check" value="보고서"> 📄 보고서
            </label>
            <label class="flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 rounded-full px-2.5 py-1.5 cursor-pointer">
              <input type="checkbox" class="type-check" value="텍스트"> 📝 텍스트
            </label>
          </div>
        </div>

        <!-- Keyword -->
        <div>
          <label class="text-xs font-semibold text-gray-500 mb-1.5 block">키워드</label>
          <input id="filter-keyword" type="text" placeholder="제목/본문 키워드"
            class="w-full text-sm border border-gray-300 rounded-lg px-2.5 py-2">
        </div>

        <!-- Boolean flags -->
        <div>
          <label class="text-xs font-semibold text-gray-500 mb-1.5 block">첨부 여부 <span id="posts-status" class="text-[10px] text-gray-400 normal-case font-normal"></span></label>
          <div class="space-y-1.5">
            <label class="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" class="bool-check" data-filter="hasAttachment" disabled> 첨부파일 있음
            </label>
            <label class="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" class="bool-check" data-filter="hasImage" disabled> 이미지 있음
            </label>
            <label class="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" class="bool-check" data-filter="hasVideo" disabled> 동영상 있음
            </label>
          </div>
        </div>

        <!-- Tags -->
        <div>
          <label class="text-xs font-semibold text-gray-500 mb-1.5 block">태그 (다중 선택)</label>
          <input id="tag-search" type="text" placeholder="태그 검색"
            class="w-full text-sm border border-gray-300 rounded-lg px-2.5 py-1.5 mb-2">
          <div id="tag-filter-list" class="flex flex-wrap gap-1.5 max-h-64 overflow-y-auto thin-scroll"></div>
        </div>
      </div>
    </aside>

    <!-- ===== Map ===== -->
    <main class="relative flex-1 min-w-0">
      <svg id="map-svg"></svg>

      <!-- legend -->
      <div class="hidden lg:block absolute left-4 bottom-4 bg-white/90 backdrop-blur border border-gray-200 rounded-xl px-3 py-2.5 text-[11px] text-gray-600 shadow-sm space-y-1">
        <div class="text-gray-500 mb-1.5 leading-relaxed">점 하나 = 글 하나 · 점 속 = 대표 사진<br>크기 = 글 분량 · 선 = 태그로 연결된 관련 글</div>
        <div class="font-semibold text-gray-800 mb-1">카테고리 (테두리 색)</div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-1">
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#3b82f6"></i>정치</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#10b981"></i>경제</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#f59e0b"></i>부동산</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#8b5cf6"></i>사회</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#14b8a6"></i>도시</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#ef4444"></i>통일</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#6366f1"></i>사법</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#ec4899"></i>소비자</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#06b6d4"></i>국제</span>
          <span class="flex items-center gap-1.5"><i class="inline-block w-2 h-2 rounded-full" style="background:#9ca3af"></i>기타</span>
        </div>
      </div>

      <div class="hidden md:flex absolute right-4 bottom-4 items-center gap-1.5 bg-white/90 backdrop-blur border border-gray-200 rounded-full px-3 py-1.5 text-[11px] text-gray-500 shadow-sm">
        <i data-lucide="mouse" class="w-3.5 h-3.5"></i> 휠 줌 · 배경 드래그 이동 · 점 드래그 재배치 · 클릭 상세
      </div>

      <!-- Loading overlay -->
      <div id="loading-overlay" class="absolute inset-0 bg-white/95 flex items-center justify-center z-20">
        <div class="text-center">
          <div class="w-10 h-10 border-4 border-gray-200 border-t-gray-900 rounded-full animate-spin mx-auto mb-3"></div>
          <div class="text-sm text-gray-500">지식맵을 그리는 중…</div>
        </div>
      </div>
    </main>

    <!-- ===== Detail panel ===== -->
    <aside id="detail-panel"
      class="slide-panel fixed inset-y-0 right-0 z-50 w-full sm:w-[440px] bg-white border-l border-gray-200
             shadow-2xl translate-x-full flex flex-col">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 shrink-0">
        <div class="font-semibold text-sm flex items-center gap-1.5"><i data-lucide="file-text" class="w-4 h-4"></i> 게시물 상세</div>
        <button id="close-detail" class="p-1 rounded hover:bg-gray-100"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="detail-content" class="flex-1 overflow-y-auto thin-scroll"></div>
    </aside>

    <!-- ===== List panel (bottom drawer) ===== -->
    <section id="list-panel"
      class="slide-panel fixed inset-x-0 bottom-0 z-40 w-full bg-white border-t border-gray-200 rounded-t-2xl
             h-[75vh] md:h-[46vh] translate-y-full flex flex-col shadow-2xl">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 shrink-0">
        <div class="font-semibold text-sm flex items-center gap-1.5"><i data-lucide="list" class="w-4 h-4"></i> 게시물 리스트</div>
        <button id="close-list" class="p-1 rounded hover:bg-gray-100"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="list-container" class="flex-1 overflow-y-auto thin-scroll"></div>
      <div id="list-sentinel" class="h-4"></div>
    </section>

  </div>
</div>

<div id="tooltip" style="opacity:0"></div>

<script src="./assets/app.js?v=2"></script>
<script>
  // Ensure freshly-created Lucide icons (e.g. in dynamic panels) render.
  window.addEventListener("load", () => { if (window.lucide) lucide.createIcons(); });
</script>
</body>
</html>
